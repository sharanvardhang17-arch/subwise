<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

<style>
:root{
  /* Subwise: a calm ledger. Jade accent for "you're in control", amber blip for things coming up. Sidebar + work area. */
  --bg:#F2F5F3;--surface:#FFFFFF;--ink:#13201B;--muted:#5D6A65;--line:#DCE3DF;--soft:#EEF3F1;
  --accent:#0B7A62;--accent-ink:#FFFFFF;--accent-soft:#E1F1EC;--accent-2:#F0A63A;
  --side:#0F221C;--side-ink:#D7E6E0;--side-muted:#86A096;--side-on:#1C3A31;
  --ok:#1D8A57;--warn:#A86500;--crit:#C33A2C;--info:#2C63C4;
  --ok-bg:#E4F4EB;--warn-bg:#FCF0DC;--crit-bg:#FBE6E3;--info-bg:#E5EDFB;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;--body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;--shadow:0 1px 2px rgba(16,34,28,.06),0 4px 16px rgba(16,34,28,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1210;--surface:#121C19;--ink:#E4EDE9;--muted:#93A39C;--line:#22312C;--soft:#17231F;
  --accent:#3CC29E;--accent-ink:#06231B;--accent-soft:#12302A;--accent-2:#F3B34F;
  --side:#070E0C;--side-ink:#D2E2DB;--side-muted:#7B958B;--side-on:#16302A;
  --ok:#4CC88A;--warn:#E8A93F;--crit:#F07565;--info:#7FA6F0;
  --ok-bg:#12291E;--warn-bg:#2E2412;--crit-bg:#331815;--info-bg:#152238;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1210;--surface:#121C19;--ink:#E4EDE9;--muted:#93A39C;--line:#22312C;--soft:#17231F;
  --accent:#3CC29E;--accent-ink:#06231B;--accent-soft:#12302A;--accent-2:#F3B34F;
  --side:#070E0C;--side-ink:#D2E2DB;--side-muted:#7B958B;--side-on:#16302A;
  --ok:#4CC88A;--warn:#E8A93F;--crit:#F07565;--info:#7FA6F0;
  --ok-bg:#12291E;--warn-bg:#2E2412;--crit-bg:#331815;--info-bg:#152238;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:16px}h3{font-size:14px}
a{color:var(--accent)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.kpi strong,.chip,.bv,.idea-amt,.dr-price,.hist b{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1}.pad{padding:16px}.pad-t{padding-top:12px}.pad-x{padding:0 16px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px}.stack p{margin:0}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-ink);text-decoration:none;font:700 21px var(--display);padding:4px 10px 18px}
.logo{width:34px;height:34px;flex:none}.brand em{font-style:normal;color:#7FD9BF}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--side-muted);text-decoration:none;font-weight:500}
.side nav a:hover{color:var(--side-ink);background:rgba(255,255,255,.04)}
.side nav a.on{background:var(--side-on);color:#fff}
.side nav a.on .ic{color:#7FD9BF}
.count{margin-left:auto;background:var(--accent-2);color:#2A1A00;font-size:12px;border-radius:99px;padding:0 7px;line-height:20px}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--side-muted);padding:10px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted);display:inline-block}.dot.ok{background:#4CC88A}.dot.warn{background:var(--accent-2)}
/* main */
.main{min-width:0;padding:0 28px 40px}
.top{display:flex;align-items:center;gap:14px;padding:20px 0 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.top-actions{margin-left:auto;display:flex;gap:8px}
.menu{display:none}
.view{display:grid;gap:18px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}.btn.danger{color:var(--crit)}.btn.danger:not(.ghost){background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.numbtn{background:none;border:1px dashed transparent;border-radius:7px;padding:2px 6px;margin:-2px -6px;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:inherit}
.numbtn:hover,.numbtn:focus-visible{border-color:var(--accent);background:var(--accent-soft)}.numbtn.plain{font-weight:400}
.numbtn.big{display:inline-flex;align-items:center;gap:6px;margin:0;padding:0 6px}.numbtn .pen{width:16px;height:16px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:13px}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.banner.demo{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.card-h a{font-size:13px;font-weight:600;text-decoration:none}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.note code{background:var(--soft);padding:1px 5px;border-radius:5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
/* KPIs */
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:14px}.kpis.three{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:2px;box-shadow:var(--shadow)}
.kpi label{font-size:13px;color:var(--muted);font-weight:500}
.kpi strong{font:700 28px/1.15 var(--display);letter-spacing:-.02em}.kpi strong span{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.hero{background:var(--side);color:#fff;border-color:var(--side)}.kpi.hero label,.kpi.hero small{color:var(--side-muted)}.kpi.hero strong{font-size:34px}
.kpi.save strong{color:var(--ok)}
/* alerts */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.alerts.compact{padding:0 12px 14px;gap:6px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;padding:11px 14px;cursor:pointer}
.alerts.compact .alert{grid-template-columns:auto 1fr;padding:9px 12px;box-shadow:none}
.alert b{display:block;font-weight:600}.alert p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.alert .sev{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;margin-top:2px}
.sev-critical{border-left-color:var(--crit)}.sev-critical .sev{background:var(--crit-bg);color:var(--crit)}
.sev-high{border-left-color:var(--warn)}.sev-high .sev{background:var(--warn-bg);color:var(--warn)}
.sev-medium{border-left-color:var(--info)}.sev-medium .sev{background:var(--info-bg);color:var(--info)}
.sev-low{border-left-color:var(--line)}.sev-low .sev{background:var(--soft);color:var(--muted)}
.atype{font-size:12px;color:var(--muted)}.a-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* timeline */
.timeline{list-style:none;margin:0;padding:0 8px 12px}
.tl{display:grid;grid-template-columns:44px 14px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer}
.tl:hover{background:var(--soft)}
.tl-date{display:grid;text-align:center;font-size:11px;color:var(--muted);line-height:1.1;text-transform:uppercase}.tl-date b{font:700 18px var(--display);color:var(--ink)}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl.deadline .tl-dot,.ce.deadline,.lg.deadline::before,.mini-ev .deadline b{background:var(--crit)}
.tl.trial .tl-dot,.ce.trial,.lg.trial::before{background:var(--accent-2)}
.tl.renewal .tl-dot,.ce.renewal,.lg.renewal::before{background:var(--info)}
.tl.ends .tl-dot,.ce.ends,.lg.ends::before{background:var(--muted)}
.tl-main b{display:block;font-weight:600}.tl-main small{color:var(--muted)}
.tl-in{font-size:12.5px;color:var(--muted)}
/* bars */
.bars{list-style:none;margin:0;padding:0 16px 16px;display:grid;gap:9px}
.bars li{display:grid;grid-template-columns:minmax(110px,170px) 1fr 84px 38px;gap:10px;align-items:center;font-size:13.5px}
.bars li[data-act]{cursor:pointer}
.bl{display:flex;gap:8px;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:9px;height:9px;border-radius:3px;background:hsl(var(--h) 55% 50%);flex:none}
.bt{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 52% 48%)}
.bv{text-align:right;font-weight:600}.bp{text-align:right;color:var(--muted);font-size:12px}
.proj{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:190px;padding:6px 16px 0;align-items:end}
.pcol{display:grid;grid-template-rows:auto 1fr auto;height:100%;align-items:end;text-align:center;gap:4px}
.pcol i{display:block;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px;align-self:end}.pcol i.part{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.pcol .pv{font-size:10.5px;color:var(--muted)}.pcol .pm{font-size:11.5px;color:var(--muted)}
.card .note{padding:0 16px 14px}
/* ideas */
.ideas{list-style:none;margin:0;padding:0 16px 14px;display:grid}
.ideas li{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ideas li:first-child{border-top:0}
.idea-amt{font:700 18px var(--display);color:var(--ok)}.idea-amt small{font:500 12px var(--body);color:var(--muted)}
.ideas b{font-weight:600}.ideas p{margin:1px 0 0;color:var(--muted);font-size:13.5px}
/* toolbar + table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 10px;flex:1;min-width:200px;max-width:340px}
.search input:not([type=checkbox]){border:0;background:transparent;padding:9px 0;width:100%;outline:none;border-radius:0}
select,input:not([type=checkbox]),textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
.toolbar select{width:auto}
textarea{resize:vertical}
.tb-sum{margin-left:auto;color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .table-wrap{border:0;box-shadow:none;border-radius:0}
table.list{width:100%;border-collapse:collapse;font-size:14px}
.list th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tbody tr{cursor:pointer}.list tbody tr:hover{background:var(--soft)}.list tbody tr:last-child td{border-bottom:0}
.list .num{text-align:right;white-space:nowrap}.list td.num small{display:block;color:var(--muted);font-size:12px}
.list.tight td{padding:8px 12px}
.who{display:flex;align-items:center;gap:10px}.who b{font-weight:600;display:block}.who small{color:var(--muted);font-size:12.5px}
.av{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;font:700 15px var(--display);background:hsl(var(--h) 60% 92%);color:hsl(var(--h) 55% 30%);flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 35% 20%);color:hsl(var(--h) 60% 78%)}}
:root[data-theme="dark"] .av{background:hsl(var(--h) 35% 20%);color:hsl(var(--h) 60% 78%)}
.av.lg{width:48px;height:48px;font-size:21px;border-radius:13px}
.cat{font-size:12.5px;white-space:nowrap}.cat::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:hsl(var(--h) 55% 50%);margin-right:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;margin-right:4px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.muted{background:var(--soft);color:var(--muted)}
.pill.ghosty{background:transparent;border:1px dashed var(--line)}.pill.save-p{background:var(--ok-bg);color:var(--ok)}
.chip{display:inline-flex;gap:6px;align-items:baseline;font-size:13px;white-space:nowrap}.chip em{font-style:normal;font-size:11.5px;padding:1px 6px;border-radius:6px}
.chip.crit em{background:var(--crit-bg);color:var(--crit)}.chip.warn em{background:var(--warn-bg);color:var(--warn)}.chip.calm em{background:var(--soft);color:var(--muted)}.chip.muted{color:var(--muted)}.chip.muted em{background:var(--soft)}
.up{color:var(--crit);font-weight:600}.down{color:var(--ok);font-weight:600}
/* drawer */
#drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);transform:translateX(105%);transition:transform .22s ease;z-index:30;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.12);overflow-y:auto}
#drawer.open{transform:none}
.dr{padding:20px 22px 0;display:grid;gap:14px}
.dr-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.dr-h h2{font-size:20px}.dr-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.dr-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--muted)}.dr-price strong{font:700 28px var(--display);color:var(--ink)}.dr-price em{font-style:normal}
.dr-price .sep{width:1px;height:16px;background:var(--line)}
.deadline-box{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:var(--r);padding:12px 14px}
.deadline-box label{display:block;font-size:12px;color:var(--muted)}.deadline-box b{font:700 17px var(--display)}.deadline-box small{display:block;color:var(--muted)}
.note-box{border-radius:10px;padding:10px 12px;font-size:13.5px}.note-box.warn{background:var(--warn-bg);color:var(--warn)}.note-box.ok{background:var(--ok-bg);color:var(--ok)}.note-box.info{background:var(--info-bg);color:var(--info)}
.dr h3{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.mini-ev,.hist,.docs-mini{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.mini-ev li{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center}
.mini-ev b{font-weight:600;justify-self:start;padding:1px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:12px}
.mini-ev .trial b{background:var(--accent-2);color:#2A1A00}.mini-ev .renewal b{background:var(--info);color:#fff}.mini-ev .deadline b{color:#fff}.mini-ev .ends b{background:var(--muted)}
.mini-ev em{font-style:normal;color:var(--muted);font-size:12.5px}
.facts{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;margin:0;font-size:14px}.facts dt{color:var(--muted)}.facts dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:transparent;padding:3px 9px;font-size:12.5px;cursor:pointer}.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--accent);color:var(--accent-ink)}
.notes{background:var(--soft);padding:10px 12px;border-radius:10px;margin:0;font-size:13.5px}
.hist li{display:grid;grid-template-columns:110px 90px auto;gap:8px}.hist em{font-style:normal;font-size:12.5px}.hist em.up{color:var(--crit)}.hist em.down{color:var(--ok)}
.docs-mini a{display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.dr-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;padding:12px 0 16px;margin-top:6px}
/* forms */

<div id="app"><div class="boot"><p><b>Subwise is starting…</b></p><p>If this message doesn’t go away, this viewer can’t run apps. Open the file in a web browser such as Chrome, Safari, Firefox or Edge.</p></div></div>

<div id="drawer" aria-hidden="true"></div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
<script>
// ===== Subwise core: pure date, money and insight logic =====
const CYCLES={weekly:{label:'Weekly',perYear:52,months:12/52},monthly:{label:'Monthly',perYear:12,months:1},quarterly:{label:'Quarterly',perYear:4,months:3},'half-yearly':{label:'Every 6 months',perYear:2,months:6},yearly:{label:'Yearly',perYear:1,months:12}};
const CATEGORIES=['Streaming','Music','Gaming','Books & audio','News & magazines','Cloud & software','Fitness','Housing','Utilities','Internet & phone','Insurance','Shopping','Transport','Finance','Other'];
const OVERLAP_CATS=['Streaming','Music','Cloud & software','Books & audio','News & magazines','Gaming'];
const COMPARE_CATS=['Utilities','Internet & phone','Insurance'];
const STATUS={active:'Active',trial:'Free trial',cancelling:'Cancelling',paused:'Paused',cancelled:'Cancelled'};

function isoOf(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}
function parseD(s){if(!s)return null;const mt=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s));if(!mt)return null;const y=+mt[1],m=+mt[2],d=+mt[3];if(m<1||m>12||d<1||d>31)return null;return new Date(y,m-1,d);}
const okD=s=>!!parseD(s);
let TODAY_OVERRIDE=null;
function today(){return TODAY_OVERRIDE||isoOf(new Date());}
function addDays(s,n){const d=parseD(s);if(!d)return s;d.setDate(d.getDate()+n);return isoOf(d);}
function addMonths(s,n){const d=parseD(s);if(!d)return s;const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return isoOf(d);}
function daysUntil(s){if(!okD(s))return null;return Math.round((parseD(s)-parseD(today()))/864e5);}
function addCycle(s,cycle,k=1){if(cycle==='weekly')return addDays(s,7*k);return addMonths(s,(CYCLES[cycle]||CYCLES.monthly).months*k);}
function minusNotice(s,v,u){if(!okD(s))return null;v=+v||0;if(!v)return s;if(u==='months')return addMonths(s,-v);if(u==='weeks')return addDays(s,-7*v);return addDays(s,-v);}
function plusNotice(s,v,u){if(!okD(s))s=today();v=+v||0;if(u==='months')return addMonths(s,v);if(u==='weeks')return addDays(s,7*v);return addDays(s,v);}
function noticeText(i){const v=+i.noticeValue||0;if(!v)return 'None';const u=i.noticeUnit||'days';return v+' '+(v===1?u.replace(/s$/,''):u);}

function toBase(v,cur,S){const fx=S.fx||{};const b=S.baseCurrency||'EUR';return (+v||0)*(fx[cur]||1)/(fx[b]||1);}
function isLive(i){return ['active','trial','cancelling'].includes(i.status);}
function monthlyEq(i,S){return toBase(i.price,i.currency,S)*(CYCLES[i.cycle]||CYCLES.monthly).perYear/12;}
function yearlyEq(i,S){return monthlyEq(i,S)*12;}
// counted in totals: active + cancelling (until it ends). Trials count as upcoming, not current spend.
function counts(i){if(i.status==='cancelling'){const e=i.cancellation&&i.cancellation.endsAt;return !e||daysUntil(e)>=0;}return i.status==='active';}

// next payment on or after today (rolls past dates forward, assuming they were paid)
function nextPay(i){let d=i.nextPayment;if(!okD(d))return null;let n=0;while(daysUntil(d)<0&&n<600){d=addCycle(d,i.cycle);n++;}
  if(i.status==='cancelling'&&i.cancellation&&i.cancellation.endsAt&&d>i.cancellation.endsAt)return null;
  if(i.status==='cancelled'||i.status==='paused')return null;return d;}

// When does the item next renew / extend for a fixed period? null = runs indefinitely or no renewal.
function renewalDate(i){
  if(!isLive(i)||i.status==='cancelling')return null;
  if(i.status==='trial')return okD(i.trialEnds)?i.trialEnds:nextPay(i);
  if(okD(i.minTermEnd)){let end=i.minTermEnd;if(daysUntil(end)>=0)return end;
    if(i.autoRenew&&+i.renewalMonths>1){let n=0;while(daysUntil(end)<0&&n<200){end=addMonths(end,+i.renewalMonths);n++;}return end;}
    return null;}
  if(i.cycle!=='monthly'&&i.cycle!=='weekly')return nextPay(i);
  return null;}
// last day to cancel before the renewal / next commitment
function cancelBy(i){
  if(!isLive(i)||i.status==='cancelling')return null;
  if(i.status==='trial')return okD(i.trialEnds)?addDays(i.trialEnds,-1):null;
  const r=renewalDate(i);if(r)return minusNotice(r,i.noticeValue,i.noticeUnit);
  return null;}
// earliest end date if the user cancels today
function earliestEnd(i){
  if(i.status==='trial')return i.trialEnds||today();
  const r=renewalDate(i);const t=today();
  if(r){const by=minusNotice(r,i.noticeValue,i.noticeUnit);if(by>=t)return r;
    // missed: next renewal period
    if(i.minTermEnd&&i.minTermEnd===r){if(+i.renewalMonths>1)return addMonths(r,+i.renewalMonths);
      return endOfNoticeFrom(plusNotice(r,0,'days'),i);}
    return addCycle(r,i.cycle);}
  const v=+i.noticeValue||0;
  if(!v){const np=nextPay(i);return np||t;}
  const e=plusNotice(t,v,i.noticeUnit);
  if(i.endOfMonth){const d=parseD(e);return isoOf(new Date(d.getFullYear(),d.getMonth()+1,0));}
  return e;}
function endOfNoticeFrom(s,i){const e=plusNotice(today(),i.noticeValue||1,i.noticeUnit||'months');return e>s?e:s;}

const ESSENTIAL=['Housing','Utilities','Insurance','Internet & phone'];
function daysSinceUse(i){if(!okD(i.lastUsed))return null;return -daysUntil(i.lastUsed);}
function unusedDays(S){return +((S.notify||{}).unusedDays)||45;}
function isUnused(i,S){if(ESSENTIAL.includes(i.category))return false;const d=daysSinceUse(i);if(d!=null)return d>=unusedDays(S);return i.usage==='never';}
function priceChange(i){const h=(Array.isArray(i.priceHistory)?i.priceHistory:[]).filter(x=>x&&okD(x.date)&&!isNaN(parseFloat(x.price))).slice().sort((a,b)=>a.date<b.date?-1:1);if(h.length<2)return null;
  const a=h[h.length-2],b=h[h.length-1];if(+b.price===+a.price)return null;
  return {from:+a.price,to:+b.price,date:b.date,pct:(b.price-a.price)/a.price*100,daysAgo:-daysUntil(b.date)};}

// ---------- events ----------
function buildEvents(items,horizonDays=400){
  const ev=[];const limit=addDays(today(),horizonDays);
  for(const i of items){
    if(i.status==='cancelled'||i.status==='paused')continue;
    let d=nextPay(i);let n=0;
    while(d&&d<=limit&&n<60){ev.push({kind:'payment',date:d,item:i,title:(i.status==='trial'&&n===0?'First charge':'Payment')});d=addCycle(d,i.cycle);n++;
      if(i.status==='cancelling'&&i.cancellation&&i.cancellation.endsAt&&d>i.cancellation.endsAt)break;}
    if(i.status==='trial'&&okD(i.trialEnds))ev.push({kind:'trial',date:i.trialEnds,item:i,title:'Free trial ends'});
    const r=renewalDate(i);
    if(r&&i.status!=='trial')ev.push({kind:'renewal',date:r,item:i,title:i.minTermEnd&&r===i.minTermEnd?'Minimum term ends':'Renews'});
    const c=cancelBy(i);

function buildSavings(items,S){

  }

  const groups={};for(const i of live)if(OVERLAP_CATS.includes(i.category)&&i.status==='active')(groups[i.category]=groups[i.category]||[]).push(i);
  const dupGroups=[];
  for(const [cat,g] of Object.entries(groups))if(g.length>=2){const sorted=g.slice().sort((a,b)=>yearlyEq(b,S)-yearlyEq(a,S));

function recordPrice(o,v,orig){o.price=v;if(orig==null||+orig===+v)return;const h=(o.priceHistory||[]).slice().sort((x,y)=>x.date<y.date?-1:1);
  if(!h.length)h.push({date:o.startDate&&o.startDate<today()?o.startDate:addDays(today(),-1),price:+orig});
  const last=h[h.length-1];if(last.date===today()){last.price=v;const prev=h[h.length-2];if(prev&&+prev.price===+v)h.pop();}else h.push({date:today(),price:v});o.priceHistory=h;}
function gridEvent(e,commit){const el=e.target;if(!el.dataset||!el.dataset.k)return;const row=el.closest('[data-gid]');if(!row)return;

function fieldHTML(f,v){const id='f_'+f.k;const val=v[f.k]??'';let inp;

  else if(f.t==='area')inp=`<textarea id="${id}" rows="2" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else if(f.t==='check')inp=`<label class="check"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.cl||'Yes')}</label>`;
  else if(f.t==='notice')inp=`<div class="pair"><input id="f_noticeValue" type="number" min="0" value="${esc(v.noticeValue??0)}" aria-label="Notice amount"><select id="f_noticeUnit" aria-label="Notice unit">${['days','weeks','months'].map(u=>`<option ${v.noticeUnit===u?'selected':''}>${u}</option>`).join('')}</select></div>`;
  else inp=`<input id="${id}" type="${f.t||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`;
  return `<div class="field ${f.w==='full'?'full':''}"><label for="${f.t==='notice'?'f_noticeValue':id}">${esc(f.l)}${f.req?' <i>*</i>':''}</label>${inp}${f.h?`<small>${esc(f.h)}</small>`:''}</div>`;}
function readFields(root,fields){const o={};for(const f of fields){if(f.t==='notice'){o.noticeValue=+$('#f_noticeValue',root).value||0;o.noticeUnit=$('#f_noticeUnit',root).value;continue;}
  const el=$('#f_'+f.k,root);if(!el)continue;o[f.k]=f.t==='check'?el.checked:f.t==='number'?(el.value===''?null:+el.value):el.value.trim();}return o;}
function openItemForm(existing,prefill,afterSave){

VIEWS.calendar=()=>{

  return `<div class="grid-cal">
   <div class="card"><div class="card-h cal-h"><button class="iconbtn" data-act="calnav" data-d="-1" aria-label="Previous month">${icon('M15 6l-6 6 6 6')}</button><h2>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2><button class="iconbtn" data-act="calnav" data-d="1" aria-label="Next month">${icon('M9 6l6 6-6 6')}</button><button class="btn small" data-act="calnav" data-d="0">Today</button></div>
     <div class="legend"><span class="lg payment">Payment</span><span class="lg deadline">Last day to cancel</span><span class="lg renewal">Renewal / term ends</span><span class="lg trial">Trial ends</span><span class="lg ends">Cancelled, ends</span></div>
     <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cw">${d}</div>`).join('')}${cells}</div></div>
   <div class="card"><div class="card-h"><h2>Renewals & deadlines, next 4 months</h2></div>
     <ul class="dl-list">${up.map(e=>{const d=daysUntil(e.date);return `<li class="${e.kind}"><div class="dl-d">${dayChip(e.date)}</div><div class="dl-m" data-act="open" data-id="${e.item.id}"><b>${esc(e.item.name)}</b><small>${evLabel(e.kind)}${e.kind==='deadline'?' · notice '+noticeText(e.item):''}</small></div><a class="iconbtn" title="Add to Google Calendar" aria-label="Add to Google Calendar" target="_blank" rel="noopener" href="${gcalLink(evLabel(e.kind)+': '+e.item.name,e.date,e.item.name+' — '+evLabel(e.kind)+'. Tracked in Subwise.')}">${icon('M4 5h16v15H4zM4 9h16M12 12v5M9.5 14.5h5')}</a></li>`;}).join('')||'<li class="muted">Nothing in the next 4 months.</li>'}</ul>
     <div class="row pad-t"><button class="btn small" data-act="copyics">Copy all as calendar file (.ics)</button></div>

function gcalLink(title,date,details){const a=date.replace(/-/g,'');const b=addDays(date,1).replace(/-/g,'');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+a+'/'+b+'&details='+encodeURIComponent(details||'');}
function buildICS(){const ev=buildEvents(ITEMS,400).filter(e=>e.kind!=='payment'&&daysUntil(e.date)>=0);const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Subwise//EN','CALSCALE:GREGORIAN'];
  ev.forEach((e,k)=>{lines.push('BEGIN:VEVENT','UID:'+e.item.id+'-'+e.kind+'-'+e.date+'@subwise','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(e.date,1).replace(/-/g,''),
    'SUMMARY:'+(evLabel(e.kind)+': '+e.item.name).replace(/[,;]/g,' '),'DESCRIPTION:'+('Notice period: '+noticeText(e.item)).replace(/[,;]/g,' '));

async function extractFile(file){const ext=(file.name.split('.').pop()||'').toLowerCase();const out={text:'',images:[],pages:0};
  if(ext==='pdf'||file.type==='application/pdf'){if(!window.pdfjsLib)throw new Error('The PDF reader didn\u2019t load. Reload the page and try again.');
    try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}
    const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;out.pages=pdf.numPages;
    for(let p=1;p<=Math.min(pdf.numPages,40);p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();out.text+=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n\n';}
    if(out.text.replace(/\s/g,'').length<150){for(let p=1;p<=Math.min(pdf.numPages,4);p++){const pg=await pdf.getPage(p);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.images.push(await new Promise(r=>c.toBlob(r,'image/png')));}}
  }else if(ext==='docx'){if(!window.mammoth)throw new Error('The Word reader didn\u2019t load. Reload the page and try again.');const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});out.text=r.value;}
  else if(ext==='doc'){throw new Error('Old .doc files can\u2019t be read. Save it as .docx or PDF and upload again.');}
  else if(file.type.startsWith('image/')){out.images.push(file);}
  else out.text=await file.text();
  out.text=out.text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();return out;}

async function handleUpload(file,itemId){
  if(file.size>25*1024*1024){toast('That file is larger than 25 MB.','error');return;}
  go('reader');const tid=toast('Reading '+file.name+'\u2026','info',0);
  let ex;try{ex=await extractFile(file);}catch(e){dismissToast(tid);toast(e.message||'Couldn\u2019t read that file.','error');return;}
  const doc={id:uid('d'),kind:'document',name:file.name,size:file.size,mime:file.type,itemId:itemId||null,uploadedAt:today(),text:ex.text.slice(0,120000),assetId:null,ocr:!ex.text&&ex.images.length>0};
  if(ASSETS&&(file.type==='application/pdf'||file.type.startsWith('image/'))&&file.size<=20*1024*1024){try{const r=await ASSETS.upload(file,{type:file.type});doc.assetId=r.id;}catch(e){}}
  UI.docId=doc.id;UI.docTab='summary';UI.pendingItem=null;await save(doc);dismissToast(tid);
  if(!ex.text&&!ex.images.length){toast('No text found in that file.','error');return;}
  if(ex.images.length&&!ex.text&&(!SAMPLE||!AI_IMAGES)){toast('This looks like a scan. Reading scans needs AI with image support in Claude.','error');return;}
  if(SAMPLE)analyzeDoc(doc.id,ex.images);else toast('Saved. Open this app in Claude to have AI read it.');}

const AI_SCHEMA=`{
 "docType": "contract" | "price_change" | "invoice" | "other",
 "item": {"name": string, "provider": string, "category": one of ${JSON.stringify(CATEGORIES)}, "type": "subscription"|"contract", "price": number (recurring price per billing period, no symbols), "currency": ISO code, "cycle": "weekly"|"monthly"|"quarterly"|"half-yearly"|"yearly", "nextPayment": "YYYY-MM-DD"|null, "startDate": "YYYY-MM-DD"|null, "minTermEnd": "YYYY-MM-DD"|null, "renewalMonths": number|null (months it renews for after the minimum term; null if it then runs month to month or indefinitely), "noticeValue": number, "noticeUnit": "days"|"weeks"|"months", "trialEnds": "YYYY-MM-DD"|null, "customerNo": string|null, "cancelEmail": string|null, "cancelAddress": string|null},
 "priceChange": {"oldPrice": number, "newPrice": number, "effectiveDate": "YYYY-MM-DD"|null} | null,
 "summary": string (2-4 short sentences in plain, friendly language, second person),
 "terms": [{"label": string, "value": string}] (4-8 most important: price, fees, minimum term, notice period, renewal, payment),
 "plain": [string] (3-6 sentences explaining complicated terms simply: what they mean for the user in practice),

async function aiCall(input,opts={}){if(!SAMPLE)throw new Error('AI is available when you open this app in Claude.');

function parseJSON(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw new Error('AI returned no data. Try again.');return JSON.parse(t.slice(a,b+1));}
async function analyzeDoc(docId,images){const d=DOCS.find(x=>x.id===docId);if(!d)return;UI.busy['an-'+docId]=true;render();

  const prefill={};Object.entries(x).forEach(([k,v])=>{if(v!==null&&v!==''&&v!==undefined)prefill[k]=v;});if(prefill.category&&!CATEGORIES.includes(prefill.category))prefill.category='Other';if(prefill.cycle&&!CYCLES[prefill.cycle])delete prefill.cycle;

  ['cx_to','cx_subj','cx_body'].forEach(k=>g(k).addEventListener('input',refreshMail));refreshMail();
  const fill=l=>{g('cx_subj').value=l.subject;g('cx_body').value=l.body;refreshMail();};

function letterTemplate(i,o){const end=earliestEnd(i);const de=o.lang==='de';const special=o.date==='special';const no=o.no?(de?`Kundennummer: ${o.no}`:`Customer number: ${o.no}`):'';
  if(de){const subject=`Kündigung ${i.name}${o.no?' – Kundennummer '+o.no:''}`;
    const body=`Sehr geehrte Damen und Herren,\n\nhiermit kündige ich meinen Vertrag „${i.name}“${no?' ('+no+')':''} ${special?'außerordentlich aufgrund der angekündigten Preiserhöhung zum frühestmöglichen Zeitpunkt':`fristgerecht zum nächstmöglichen Zeitpunkt, nach meiner Berechnung zum ${parseD(end).toLocaleDateString('de-DE')}`}.${o.reason?`\n\nGrund: ${o.reason}.`:''}\n\nBitte bestätigen Sie mir den Eingang dieser Kündigung sowie das genaue Vertragsende schriftlich.${o.sepa?'\n\nDas erteilte SEPA-Lastschriftmandat widerrufe ich mit Wirkung zum Vertragsende.':''}${o.mkt?'\n\nEiner Kontaktaufnahme zu Werbe- oder Rückgewinnungszwecken widerspreche ich.':''}\n\nMit freundlichen Grüßen\n${o.name||'[Ihr Name]'}${o.addr?'\n'+o.addr:''}`;
    return {subject,body};}
  const subject=`Cancellation of ${i.name}${o.no?' – customer no. '+o.no:''}`;
  const body=`Dear ${i.provider||'Sir or Madam'} team,\n\nI hereby cancel my ${i.name} ${i.type==='contract'?'contract':'subscription'}${no?' ('+no+')':''} ${special?'with immediate effect, using my special right to cancel following your announced price increase':`at the earliest possible date, which by my calculation is ${fmtDate(end)}`}.${o.reason?`\n\nReason: ${o.reason}.`:''}\n\nPlease confirm in writing that you have received this cancellation and the date on which it takes effect.${o.sepa?'\n\nI revoke the direct debit mandate with effect from the end of the contract.':''}${o.mkt?'\n\nPlease do not contact me for marketing or retention purposes.':''}\n\nKind regards\n${o.name||'[Your name]'}${o.addr?'\n'+o.addr:''}`;
  return {subject,body};}
async function letterAI(i,o,onText){const end=earliestEnd(i);const doc=DOCS.find(d=>d.itemId===i.id&&d.ai);
  const p=`Write a short, firm, polite cancellation ${o.channel==='email'?'email':'letter'} in ${o.lang==='de'?'German (formal "Sie", standard Kündigung style)':'English'} for a consumer.\nToday: ${today()}. Service: ${i.name} from ${i.provider}. Type: ${i.type}. Customer number: ${o.no||'unknown'}. Notice period: ${noticeText(i)}. Minimum term ends: ${i.minTermEnd||'n/a'}. Earliest end date by our calculation: ${end}.\nEnd date wanted: ${o.date==='special'?'immediately / earliest possible using the special right to cancel because of a price increase':'earliest possible date'}. Reason: ${o.reason||'none given (do not invent one)'}.\n${o.sepa?'Include revoking the SEPA direct debit mandate at the end.':''} ${o.mkt?'Include objecting to marketing/retention contact.':''} Always ask for written confirmation with the exact end date. Sign with: ${o.name||'[name]'}${o.addr?', '+o.addr.replace(/\n/g,', '):''}.\n${doc?'Relevant contract summary: '+doc.ai.summary:''}\nReturn ONLY JSON: {"subject": string, "body": string} with \\n line breaks. No placeholders except a name if missing.`;
  const r=await aiCall(p,{modelTier:'quick'});const j=parseJSON(r.text);return {subject:j.subject||'',body:j.body||''};}
function letterPDF(i,o,subject,body){if(!window.jspdf){toast('The PDF tool didn\u2019t load. Use Copy instead.','error');return;}
  const doc=new jspdf.jsPDF({unit:'mm',format:'a4'});doc.setFont('helvetica','normal');doc.setFontSize(10);
  let y=20;const sender=[o.name,...(o.addr||'').split('\n')].filter(Boolean).join(' · ');if(sender){doc.setTextColor(110);doc.text(sender,20,y);doc.setTextColor(0);}
  y=45;const rcpt=(o.to||'').split('\n').filter(l=>!/@/.test(l)).join('\n')||i.provider;doc.setFontSize(11);doc.text(doc.splitTextToSize(rcpt.replace(/, /g,'\n'),90),20,y);
  y=85;const place=(o.addr.match(/\d{5}\s+([^\n,]+)/)||[])[1];doc.text((place?place.trim()+', ':'')+parseD(today()).toLocaleDateString(o.lang==='de'?'de-DE':'en-GB'),190,y,{align:'right'});
  y=100;doc.setFont('helvetica','bold');doc.text(doc.splitTextToSize(subject,170),20,y);doc.setFont('helvetica','normal');y+=12;
  const lines=doc.splitTextToSize(body,170);lines.forEach(l=>{if(y>275){doc.addPage();y=20;}doc.text(l,20,y);y+=5.6;});
  const out=doc.output('arraybuffer');saveFile(('Cancellation '+i.name).replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-')+'.pdf',out);}
async function saveFile(name,data){if(!DL&&STANDALONE){const b=new Blob([data]);const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return;}
  if(!DL){toast('Downloads aren\u2019t available here.','error');return;}try{await DL.save({filename:name,data});}catch(e){if(e&&e.code!=='declined')toast('Couldn\u2019t save the file.','error');}}

  dismiss:async d=>{SET.dismissed=Object.assign({},SET.dismissed,{[d.key]:today()});await saveSettings();},
  undismiss:async d=>{const x=Object.assign({},SET.dismissed);delete x[d.key];SET.dismissed=x;await saveSettings();},
  savenotify:async()=>{const dl=$('#n_dl').value.split(/[,\s]+/).map(Number).filter(n=>n>0&&n<=180);SET.notify={payments:+$('#n_pay').value||0,trials:+$('#n_trial').value||0,renewals:+$('#n_ren').value||0,deadlines:dl.length?dl:[30,14,7,1],priceIncrease:$('#n_price').checked,unusedDays:Math.max(7,+$('#n_unused').value||45)};await saveSettings();toast('Reminder settings saved');},
  opendoc:d=>{UI.docId=d.id;UI.docTab='summary';closeDrawer();if(route()!=='reader')go('reader');else render();},
  doctab:d=>{UI.docTab=d.t;render();},
  analyze:d=>analyzeDoc(d.id),
  asksugg:d=>askDoc(UI.docId,d.q),
  linkdoc:d=>linkDocForm(d.id),
  deldoc:d=>{const doc=DOCS.find(x=>x.id===d.id);confirmBox('Delete '+doc.name+'?','The document and its summary will be removed.','Delete',async()=>{if(doc.assetId&&ASSETS){try{await ASSETS.delete(doc.assetId);}catch(e){}}await removeObj(doc);UI.docId=null;toast('Document deleted');});},
  saveprofile:async()=>{SET.profile=Object.assign({},SET.profile,{name:$('#s_name').value.trim(),address:$('#s_addr').value.trim()});SET.country=$('#s_country').value;await saveSettings();toast('Saved');},
  savefx:async()=>{const fx={};Object.keys(SET.fx).forEach(c=>{const v=+$('#fx_'+c).value;fx[c]=c==='EUR'?1:(v>0?v:SET.fx[c]);});SET.fx=fx;SET.baseCurrency=$('#s_base').value;await saveSettings();toast('Currencies saved');},
  exportjson:()=>saveFile('subwise-backup-'+today()+'.json',JSON.stringify({app:'Subwise',exportedAt:new Date().toISOString(),items:ITEMS,docs:DOCS,letters:LETTERS,settings:SET},null,1)),
  exportcsv:()=>saveFile('subwise-subscriptions-'+today()+'.csv','﻿'+csvText()),
  copycsv:async()=>{try{await navigator.clipboard.writeText(csvText());toast('Copied');}catch(e){}},
  wipe:()=>confirmBox('Delete all your data?','Every subscription, document, letter and setting will be removed. This can\u2019t be undone.','Delete everything',async()=>{
    if(MODE==='cloud'){for(const o of [...ITEMS,...DOCS,...LETTERS]){try{await COL.doc(o.id).delete();}catch(e){}}SET=Object.assign(defaultSettings(),{started:true});await saveSettings();}
    else{try{localStorage.removeItem(LS_KEY);}catch(e){}}ITEMS=[];DOCS=[];LETTERS=[];if(MODE!=='cloud'){MODE='local';SET=Object.assign(defaultSettings(),{started:true});lsSet();}render();toast('All data deleted');})
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const fn=ACT[a.dataset.act];if(!fn)return;
  if(a.tagName==='A'&&a.getAttribute('href')==='#')e.preventDefault();if(a.tagName==='A'&&a.dataset.act==='startcancel')e.preventDefault();
  if(a.closest('.side')&&window.innerWidth<900)$('#side').classList.remove('show');e.stopPropagation();fn(a.dataset,a,e);});
document.addEventListener('click',e=>{const g=e.target.closest('a[data-go],a[href^="#"]:not([data-act])');if(!g)return;const r=g.dataset.go||g.getAttribute('href').slice(1);
  if(!ROUTES.some(x=>x[0]===r))return;e.preventDefault();if(window.innerWidth<900)$('#side').classList.remove('show');go(r);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modals').children.length)closeModal();else closeDrawer();}});
init();

</script>
</body>
</html>
